# Scheduled hub aggregation (audit 2026-08-27: the family-wide index had
# drifted 7 months stale because nothing ever re-ran the aggregator).
# Pulls the sibling collections from their live GitHub Pages sites, rewrites
# data/recipes_master.json, and lets the existing Rebuild Indexes workflow's
# push-path trigger regenerate the index/shards/pagefind on the commit.
name: Aggregate Collections

on:
  schedule:
    - cron: '17 6 * * 1'  # weekly, Mondays 06:17 UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Aggregate sibling collections
        run: python scripts/aggregate_collections.py

      - name: Regenerate index
        run: python scripts/generate_index.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/recipes_master.json data/recipes_index.json
          git diff --staged --quiet || git commit -m "Aggregate family collections (scheduled)"
          git push
